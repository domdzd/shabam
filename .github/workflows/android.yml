name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub pre-release with the built APKs"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    env:
      NANOTUNE_VERSION_CODE: ${{ github.run_number }}
      # Optional: a private HTTPS URL to Apple's ShazamKit AAR (+ its SHA-256). See docs/RELEASE.md.
      SHAZAMKIT_AAR_URL: ${{ secrets.SHAZAMKIT_AAR_URL }}
      SHAZAMKIT_AAR_SHA256: ${{ secrets.SHAZAMKIT_AAR_SHA256 }}
      # Optional: base URL of your NanoTune server compiled in as the default.
      NANOTUNE_API_BASE_URL: ${{ vars.NANOTUNE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keep a stable fallback signing key between CI runs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nanotune-ci-debug-keystore-v1

      - name: Fetch ShazamKit AAR (only if configured)
        if: ${{ env.SHAZAMKIT_AAR_URL != '' }}
        run: |
          curl --fail --silent --show-error --location -o app/libs/shazamkit-android-release.aar "$SHAZAMKIT_AAR_URL"
          if [ -n "$SHAZAMKIT_AAR_SHA256" ]; then
            echo "$SHAZAMKIT_AAR_SHA256  app/libs/shazamkit-android-release.aar" | sha256sum --check -
          fi

      - name: Prepare release keystore (only if configured)
        env:
          KEYSTORE_B64: ${{ secrets.NANOTUNE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nanotune-release.jks"
            echo "NANOTUNE_KEYSTORE_FILE=$RUNNER_TEMP/nanotune-release.jks" >> "$GITHUB_ENV"
            echo "Release APK will be signed with the configured release key."
          else
            echo "::notice::No NANOTUNE_KEYSTORE_BASE64 secret; the release APK is signed with the CI fallback key."
          fi

      - name: Build, unit test and lint
        env:
          NANOTUNE_KEYSTORE_PASSWORD: ${{ secrets.NANOTUNE_KEYSTORE_PASSWORD }}
          NANOTUNE_KEY_ALIAS: ${{ secrets.NANOTUNE_KEY_ALIAS }}
          NANOTUNE_KEY_PASSWORD: ${{ secrets.NANOTUNE_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace --continue \
            -Pnanotune.apiBaseUrl="${NANOTUNE_API_BASE_URL}" \
            testDebugUnitTest assembleDebug assembleRelease lintDebug

      - name: Print lint summary
        if: always()
        run: cat app/build/reports/lint-results-debug.txt 2>/dev/null | tail -n 150 || true

      - name: Collect APKs
        run: |
          mkdir -p ../dist
          VERSION=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "../dist/NanoTune-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/NanoTune-${VERSION}-build${GITHUB_RUN_NUMBER}-debug.apk"
          (cd ../dist && sha256sum *.apk | tee SHA256SUMS.txt)
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: nanotune-apks
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanotune-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nanotune-apks
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.0-build.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('NanoTune 0.1.0 (build {0})', github.run_number) }}
          prerelease: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            Sideloadable Android build of NanoTune (Android 8.0+).

            * `NanoTune-*-buildN.apk` — optimised release build (install this one).
            * `NanoTune-*-debug.apk` — debuggable build for troubleshooting.

            Music recognition needs the ShazamKit engine and a NanoTune server — see
            docs/RECOGNITION_PROVIDERS.md and docs/DEPLOYMENT.md. Builds made without the Apple
            ShazamKit AAR show "ShazamKit not included in this build" instead of identifying songs.
