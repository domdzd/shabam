org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# NanoTune build configuration (override with -P<name>=<value> or ~/.gradle/gradle.properties)
# ---------------------------------------------------------------------------
# Application ID shown to Android. Change it when you rebrand or publish your own build.
nanotune.applicationId=io.github.domdzd.nanotune
# Default NanoTune backend URL compiled into the app. Leave empty to ask the user in Settings.
# Example: https://api.example.com
nanotune.apiBaseUrl=
# Contact string sent in the MusicBrainz User-Agent (a URL or e-mail you control).
nanotune.musicBrainzContact=https://github.com/domdzd/shabam
# Optional path to the Apple ShazamKit Android AAR. Defaults to app/libs/shazamkit-android-release.aar.
# nanotune.shazamkitAar=/absolute/path/to/shazamkit-android-release.aar
